server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos do frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Requisições para a API são repassadas ao serviço "backend" do Docker Compose.
    # O navegador sempre usa o mesmo endereço da página (/api/...), então o nome
    # interno "backend" só precisa ser resolvido dentro da rede do Docker.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 1m;
    }
}
