<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compiladores — Visualizador Educacional</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f6f8;
      color: #1f2328;
    }
    main { text-align: center; padding: 16px; }
    h1 { font-size: 2.5rem; margin: 0 0 8px; }
    p { margin: 4px 0; color: #59636e; }
    .erro { color: #cf222e; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      p { color: #9198a1; }
      .erro { color: #ff7b72; }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="mensagem">Carregando…</h1>
    <p>Visualizador educacional de análise léxica e sintática para Python</p>
    <p id="status"></p>
  </main>
  <script>
    // A mensagem vem do backend: se aparecer "Hello, World!",
    // frontend, backend e a comunicação entre eles estão funcionando.
    fetch("/api/hello")
      .then((resposta) => {
        if (!resposta.ok) throw new Error("HTTP " + resposta.status);
        return resposta.json();
      })
      .then((dados) => {
        document.getElementById("mensagem").textContent = dados.message;
        document.getElementById("status").textContent = "Mensagem recebida do backend.";
      })
      .catch((erro) => {
        const msg = document.getElementById("mensagem");
        msg.textContent = "Backend indisponível";
        msg.className = "erro";
        document.getElementById("status").textContent = erro.message;
      });
  </script>
</body>
</html>
