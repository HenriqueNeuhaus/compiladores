services:
  backend:
    build: ./backend
    container_name: compiladores-backend
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Assistente de IA (diferencial da Etapa 4). O endereço é o nome do serviço
    # "ollama" na rede interna do Compose; a porta 11434 não é publicada no host.
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODELO=llama3.2
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: compiladores-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Ollama: executa o modelo Llama 3.2 usado pelo assistente de IA.
  # O modelo fica no volume ollama_data e é baixado uma única vez com:
  #   docker compose exec ollama ollama pull llama3.2
  # Sem o modelo (ou com este serviço parado) a aplicação continua funcionando;
  # só o assistente de IA informa que está indisponível.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  # ---------------------------------------------------------------------------
  # Serviços de teste: só são criados com --profile testes.
  # Veja a seção "Testes" do README ou rode scripts/testar.ps1 / scripts/testar.sh.
  # ---------------------------------------------------------------------------

  testes-backend:
    profiles: ["testes"]
    build: ./backend
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-t", ".", "-v"]

  testes-frontend:
    profiles: ["testes"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
    command: ["node", "--test", "tests/unit/*.test.js"]

  testes-e2e:
    profiles: ["testes"]
    build: ./tests/e2e
    working_dir: /projeto
    volumes:
      - .:/projeto:ro
    environment:
      BASE_URL: http://frontend
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      frontend:
        condition: service_healthy
    command: ["python", "-m", "unittest", "tests.e2e.test_interface", "-v"]

volumes:
  ollama_data:
